<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Template Download</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background: #d4edda; border-color: #c3e6cb; }
        .error { background: #f8d7da; border-color: #f5c6cb; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .log { background: #f8f9fa; padding: 10px; border-radius: 5px; margin: 10px 0; font-family: monospace; }
    </style>
</head>
<body>
    <h1>🧪 Test Template Download</h1>
    
    <div class="test-section">
        <h3>Test 1: Direct Link Download</h3>
        <a href="/api/excel/template" download="template_khach_moi.xlsx">
            <button>Download Template (Direct Link)</button>
        </a>
        <p>Click button above to test direct download</p>
    </div>
    
    <div class="test-section">
        <h3>Test 2: JavaScript Download</h3>
        <button onclick="downloadTemplate()">Download Template (JavaScript)</button>
        <p>Click button above to test JavaScript download</p>
    </div>
    
    <div class="test-section">
        <h3>Test 3: Fetch API Test</h3>
        <button onclick="testFetch()">Test Fetch API</button>
        <div id="fetchResult" class="log"></div>
    </div>
    
    <div class="test-section">
        <h3>Test 4: Check Server Response</h3>
        <button onclick="checkServer()">Check Server Response</button>
        <div id="serverResult" class="log"></div>
    </div>

    <script>
        function downloadTemplate() {
            try {
                console.log('Starting template download...');
                const link = document.createElement('a');
                link.href = '/api/excel/template';
                link.download = 'template_khach_moi.xlsx';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                console.log('Template download initiated');
                alert('✅ Download initiated successfully!');
            } catch (error) {
                console.error('Download error:', error);
                alert('❌ Download failed: ' + error.message);
            }
        }
        
        async function testFetch() {
            const resultDiv = document.getElementById('fetchResult');
            try {
                resultDiv.innerHTML = 'Testing fetch...';
                const response = await fetch('/api/excel/template');
                resultDiv.innerHTML = `
                    Status: ${response.status}<br>
                    Status Text: ${response.statusText}<br>
                    Content-Type: ${response.headers.get('Content-Type')}<br>
                    Content-Disposition: ${response.headers.get('Content-Disposition')}<br>
                    Content-Length: ${response.headers.get('Content-Length')}
                `;
                
                if (response.ok) {
                    resultDiv.className = 'log success';
                    resultDiv.innerHTML += '<br>✅ Fetch successful!';
                } else {
                    resultDiv.className = 'log error';
                    resultDiv.innerHTML += '<br>❌ Fetch failed!';
                }
            } catch (error) {
                resultDiv.className = 'log error';
                resultDiv.innerHTML = '❌ Fetch error: ' + error.message;
            }
        }
        
        async function checkServer() {
            const resultDiv = document.getElementById('serverResult');
            try {
                resultDiv.innerHTML = 'Checking server...';
                const response = await fetch('/api/excel/template');
                const text = await response.text();
                
                resultDiv.innerHTML = `
                    Status: ${response.status}<br>
                    Response Length: ${text.length}<br>
                    First 100 chars: ${text.substring(0, 100)}...
                `;
                
                if (response.ok) {
                    resultDiv.className = 'log success';
                    resultDiv.innerHTML += '<br>✅ Server response OK!';
                } else {
                    resultDiv.className = 'log error';
                    resultDiv.innerHTML += '<br>❌ Server error!';
                }
            } catch (error) {
                resultDiv.className = 'log error';
                resultDiv.innerHTML = '❌ Server check error: ' + error.message;
            }
        }
        
        // Auto-run some tests on page load
        window.onload = function() {
            console.log('Page loaded, running initial tests...');
            testFetch();
        };
    </script>
</body>
</html>
