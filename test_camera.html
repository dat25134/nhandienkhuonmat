<!DOCTYPE html>
<html>
<head>
    <title>Camera Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        video { width: 400px; height: 300px; border: 2px solid #ccc; }
        button { padding: 10px 20px; margin: 10px; font-size: 16px; }
        .error { color: red; }
        .success { color: green; }
    </style>
</head>
<body>
    <h1>Test Camera</h1>
    
    <div id="status">Đang kiểm tra...</div>
    
    <video id="video" autoplay muted></video>
    <br>
    <button onclick="startCamera()">Start Camera</button>
    <button onclick="stopCamera()">Stop Camera</button>
    
    <script>
        let stream = null;
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        
        async function startCamera() {
            try {
                status.textContent = 'Đang khởi động camera...';
                
                if (!navigator.mediaDevices) {
                    throw new Error('MediaDevices API không được hỗ trợ');
                }
                
                stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                status.textContent = 'Camera đã khởi động thành công!';
                status.className = 'success';
                
            } catch (error) {
                console.error('Camera error:', error);
                status.textContent = 'Lỗi camera: ' + error.message;
                status.className = 'error';
            }
        }
        
        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
                video.srcObject = null;
                status.textContent = 'Camera đã tắt';
                status.className = '';
            }
        }
        
        // Kiểm tra khi trang load
        window.onload = function() {
            if (!navigator.mediaDevices) {
                status.textContent = 'Trình duyệt không hỗ trợ MediaDevices API';
                status.className = 'error';
            } else {
                status.textContent = 'Sẵn sàng test camera';
                status.className = 'success';
            }
        };
    </script>
</body>
</html>
