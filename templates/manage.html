<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý khách</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-ui.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
    <style>
        /* Force button colors với specificity cực cao */
        body div.container main div.card button.btn.btn-danger,
        body div.container main div.card a.btn.btn-danger {
            background: #dc2626 !important;
            border-color: #dc2626 !important;
            color: white !important;
            background-image: none !important;
            background-color: #dc2626 !important;
        }
        body div.container main div.card button.btn.btn-primary,
        body div.container main div.card a.btn.btn-primary {
            background: #7c3aed !important;
            border-color: #7c3aed !important;
            color: white !important;
            background-image: none !important;
            background-color: #7c3aed !important;
        }
        body div.container main div.card button.btn.btn-success,
        body div.container main div.card a.btn.btn-success {
            background: #059669 !important;
            border-color: #059669 !important;
            color: white !important;
            background-image: none !important;
            background-color: #059669 !important;
        }
        body div.container main div.card button.btn.btn-info,
        body div.container main div.card a.btn.btn-info {
            background: #0284c7 !important;
            border-color: #0284c7 !important;
            color: white !important;
            background-image: none !important;
            background-color: #0284c7 !important;
        }
        body div.container main div.card button.btn.btn-secondary,
        body div.container main div.card a.btn.btn-secondary {
            background: #374151 !important;
            border-color: #374151 !important;
            color: white !important;
            background-image: none !important;
            background-color: #374151 !important;
        }
        
        /* Test với màu sắc rõ ràng */
        #deleteAllUsers {
            background: #ff0000 !important;
            color: #ffffff !important;
            border: 2px solid #ff0000 !important;
        }
        #saveProfile {
            background: #0000ff !important;
            color: #ffffff !important;
            border: 2px solid #0000ff !important;
        }
        #importExcel {
            background: #00ff00 !important;
            color: #000000 !important;
            border: 2px solid #00ff00 !important;
        }
        
        /* Test tất cả button */
        button {
            background: #ff00ff !important;
            color: #ffffff !important;
            border: 3px solid #ff00ff !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <div class="logo"></div>
            <h1>Quản lý khách</h1>
        </div>
        <nav>
            <a href="/">Trang chủ</a>
            <a href="/welcome">Welcome</a>
            <a href="/training">Training</a>
            <a href="/manage" class="active">Quản lý</a>
            <a href="/checkins">Check-ins</a>
        </nav>

        <main>
            <div class="card users-section">
                <h2>Danh sách khách</h2>
                <div class="row" style="margin-bottom: 12px;">
                    <input id="searchUser" type="text" placeholder="Tìm theo tên/điện thoại/công ty" class="grow">
                    <button id="rebuildCache" class="btn btn-secondary">Làm mới cache nhận diện</button>
                    <button id="downloadTemplate" class="btn btn-info">Tải template Excel</button>
                    <!-- <a href="/api/excel/template" download="template_khach_moi.xlsx" class="btn btn-info">Tải trực tiếp</a> -->
                    <button id="deleteAllUsers" class="btn btn-danger">Xóa toàn bộ khách</button>
                </div>
                
                <!-- Excel Import Section -->
                <div class="card" style="background: rgba(34,197,94,.05); border-color: rgba(34,197,94,.2); margin-bottom: 15px;">
                    <h3 style="margin: 0 0 10px 0; color: var(--ink);">📊 Import từ Excel</h3>
                    <div class="row">
                        <input id="excelFile" type="file" accept=".xlsx,.xls" class="grow">
                        <button id="importExcel" class="btn btn-success">Import Excel</button>
                        <button id="clearImport" class="btn btn-secondary">Xóa file</button>
                    </div>
                    <div id="importStatus" class="hint" style="margin-top: 10px;"></div>
                </div>
                <div id="userList" class="users-list"></div>
            </div>

            <div class="card training-section">
                <h2>Chỉnh sửa hồ sơ</h2>
                <div id="editPanel" style="display:none;">
                    <div class="form-group">
                        <label>Họ tên</label>
                        <input id="editName" type="text" placeholder="Tên">
                    </div>
                    <div class="form-group">
                        <div class="grid grid-3">
                            <input id="editPhone" type="text" placeholder="Số điện thoại">
                            <select id="editGender">
                                <option value="">Giới tính</option>
                                <option value="Nam">Nam</option>
                                <option value="Nữ">Nữ</option>
                                <option value="Khác">Khác</option>
                            </select>
                            <input id="editCompany" type="text" placeholder="Công ty">
                            <input id="editDepartment" type="text" placeholder="Bộ phận">
                            <input id="editPosition" type="text" placeholder="Vị trí">
                            <input id="editSeatNumber" type="text" placeholder="Số ghế (VD: A01, B05)" required>
                        </div>
                    </div>
                    <div class="row" style="margin:10px 0;">
                        <button id="saveProfile" class="btn btn-primary">Lưu hồ sơ</button>
                        <button id="deleteUser" class="btn btn-secondary">Xóa khách</button>
                    </div>

                    <h3>Ảnh đại diện</h3>
                    <div class="row" style="margin-bottom:10px; align-items: center; gap: 12px;">
                        <img id="avatarPreview" src="" alt="Avatar" style="width:80px;height:80px;object-fit:cover;border-radius:50%;border:1px solid #ddd;display:none;" onerror="this.style.display='none'">
                        <input id="avatarFile" type="file" accept="image/*">
                        <button id="uploadAvatarBtn" class="btn btn-success">Cập nhật avatar</button>
                    </div>

                    <h3>Ảnh training</h3>
                    <div id="imageGrid" class="grid" style="margin-bottom:10px;"></div>
                    <div class="row">
                        <button id="removeSelectedBtn" class="btn btn-secondary">Xóa ảnh đã chọn</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/manage.js') }}"></script>
</body>
</html>
