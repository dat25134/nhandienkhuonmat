<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/welcome.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
</head>
<body>
    <div class="welcome-layout">
        <div class="bg"></div>
        <canvas id="fxFireworks"></canvas>
        
        <!-- Flags -->
        <div class="flag-container">
            <div class="flag flag-vietnam">
                <div class="flag-stripes">
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                </div>
                <div class="flag-star">★</div>
            </div>
            <div class="flag flag-party">
                <div class="flag-stripes">
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                    <div class="flag-stripe"></div>
                </div>
                <div class="flag-symbol">☭</div>
            </div>
        </div>

        <div class="left-pane">
            <div class="brand-title">NHIỆT LIỆT CHÀO MỪNG</div>
            <div id="heroWelcome" class="hero-welcome" aria-live="polite" aria-atomic="true"></div>
        </div>

        <aside class="right-pane">
            <div class="recent-title">Vừa điểm danh</div>
            <ul id="recentList" class="recent-list"></ul>
        </aside>

        <!-- Camera Pane -->
        <div class="camera-pane">
            <div class="camera-header">
                <div class="camera-title">Camera</div>
                <div class="camera-controls">
                    <button id="cameraToggle" class="camera-btn" title="Bật/Tắt Camera">
                        <span class="camera-icon">📹</span>
                    </button>
                    <select id="cameraSelect" class="camera-select" title="Chọn Camera">
                        <option value="">Chọn camera...</option>
                    </select>
                </div>
            </div>
            <div class="camera-preview">
                <video id="cameraVideo" autoplay muted playsinline></video>
                <canvas id="cameraOverlay"></canvas>
                <div id="cameraPlaceholder" class="camera-placeholder">
                    <div class="placeholder-icon">📷</div>
                    <div class="placeholder-text">Camera chưa được bật</div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Polyfill cho MediaDevices API -->
    <script>
        // Polyfill cho MediaDevices API
        if (!navigator.mediaDevices) {
            navigator.mediaDevices = {};
        }

        if (!navigator.mediaDevices.getUserMedia) {
            navigator.mediaDevices.getUserMedia = function(constraints) {
                const getUserMedia = navigator.webkitGetUserMedia || navigator.mozGetUserMedia || navigator.getUserMedia;

                if (!getUserMedia) {
                    return Promise.reject(new Error('getUserMedia is not implemented in this browser'));
                }

                return new Promise(function(resolve, reject) {
                    getUserMedia.call(navigator, constraints, resolve, reject);
                });
            }
        }

        if (!navigator.mediaDevices.enumerateDevices) {
            navigator.mediaDevices.enumerateDevices = function() {
                return Promise.resolve([]);
            }
        }
    </script>

    <!-- Simplified camera manager for welcome page -->
    <script src="{{ url_for('static', filename='js/welcome_camera.js') }}"></script>
    <script src="{{ url_for('static', filename='js/welcome.js') }}"></script>
</body>
</html>
