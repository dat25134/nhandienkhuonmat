<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training - Hệ thống nhận dạng khuôn mặt</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-ui.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
</head>
<body>
    <div class="container">
        <div class="brand">
            <div class="logo"></div>
            <h1>Training nhận dạng khuôn mặt</h1>
        </div>
        <nav>
            <a href="/">Trang chủ</a>
            <a href="/welcome">Welcome</a>
            <a href="/training" class="active">Training</a>
            <a href="/manage">Quản lý</a>
            <a href="/checkins">Check-ins</a>
        </nav>

        <main>
            <div class="card training-section">
                <h2>Thêm người dùng mới</h2>
                
                <div class="form-group">
                    <label for="userName">Tên người dùng:</label>
                    <input type="text" id="userName" placeholder="Nhập tên người dùng" required>
                </div>

                <div class="form-group">
                    <label>Thông tin bổ sung:</label>
                    <div class="grid grid-3">
                        <input id="userPhone" type="text" placeholder="Số điện thoại">
                        <select id="userGender">
                            <option value="">Giới tính</option>
                            <option value="Nam">Nam</option>
                            <option value="Nữ">Nữ</option>
                            <option value="Khác">Khác</option>
                        </select>
                        <input id="userCompany" type="text" placeholder="Công ty">
                        <input id="userDepartment" type="text" placeholder="Bộ phận">
                        <input id="userPosition" type="text" placeholder="Vị trí">
                        <input id="userSeatNumber" type="text" placeholder="Số ghế (VD: A01, B05)" required>
                    </div>
                </div>

                <div class="camera-controls">
                    <select id="cameraSelect">
                        <option value="">Chọn camera...</option>
                    </select>
                    <button id="startCamera" class="btn btn-primary">Bật camera</button>
                    <button id="stopCamera" class="btn btn-secondary" disabled>Tắt camera</button>
                </div>
                
                <div class="video-container">
                    <video id="video" autoplay muted playsinline></video>
                    <canvas id="overlay"></canvas>
                    <canvas id="canvas" style="display: none;"></canvas>
                </div>

                <div class="training-controls">
                    <div class="row">
                        <button id="captureFace" class="btn btn-success" disabled>Chụp khuôn mặt</button>
                        <button id="clearCaptured" class="btn btn-secondary">Xóa ảnh đã chụp</button>
                        <input id="uploadImages" type="file" accept="image/*" multiple />
                    </div>
                    <small class="hint">(Chụp bắt buộc 3 ảnh: chính diện, quay trái, quay phải)</small>
                    <button id="saveUser" class="btn btn-primary" disabled>Lưu người dùng</button>
                </div>

                <div id="trainingResult" class="result-container" style="display: none;">
                    <h3>Kết quả training</h3>
                    <div id="trainingContent"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='js/camera_new.js') }}"></script>
    <script src="{{ url_for('static', filename='js/training.js') }}"></script>
</body>
</html>
