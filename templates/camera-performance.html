<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <title>KYC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <style>
    :root{
      --bg:#0b1220; --bg2:#0e1630;
      --card:#0f172a; --card2:#111c3a;
      --ink:#e5e7eb; --muted:#94a3b8;
      --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; --pri:#8b5cf6;
      --bd: rgba(255,255,255,.08);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--ink); background:
        radial-gradient(1200px 600px at 10% -10%, #172554 0, transparent 50%),
        radial-gradient(1200px 600px at 110% 10%, #0b3a2a 0, transparent 50%),
        linear-gradient(180deg, var(--bg), var(--bg2));
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow-x:hidden;
    }
    .container{max-width:720px; margin:0 auto; padding:16px; display:flex; flex-direction:column; gap:12px;}
    .brand{display:flex; align-items:center; gap:10px; padding:8px 0 2px}
    .logo{width:28px;height:28px;border-radius:10px;background:conic-gradient(from 240deg,#22c55e,#06b6d4,#8b5cf6,#22c55e)}
    .brand h1{font-size:16px;margin:0}
    .card{background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
      border:1px solid var(--bd); border-radius:16px; padding:12px; backdrop-filter: blur(6px);}
    .row{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
    .grow{flex:1}
    .chip{display:inline-flex; align-items:center; gap:8px; padding:6px 10px; border-radius:999px; font-weight:600; background:#1f2937; border:1px solid var(--bd)}
    .chip.ok{background:rgba(34,197,94,.15); color:#bbf7d0}
    .chip.warn{background:rgba(245,158,11,.15); color:#fde68a}
    .chip.err{background:rgba(239,68,68,.15); color:#fecaca}
    .hint{color:var(--muted); font-size:13px}
    .btn{appearance:none; border:1px solid var(--bd); background:linear-gradient(180deg,#111827,#0b1220);
      color:#fff; padding:12px 14px; border-radius:12px; font-weight:700; letter-spacing:.2px; box-shadow: 0 8px 20px rgba(0,0,0,.25);}
    .btn:disabled{opacity:.5}
    .btn.ghost{background:transparent}
    .btn.primary{background:linear-gradient(180deg,#7c3aed,#6d28d9); border-color:rgba(139,92,246,.5)}
    .stage{position:relative; width:100%; aspect-ratio:3/4; border-radius:16px; overflow:hidden; background:#000;
      box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 1px var(--bd) inset;}
    video, canvas{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block;}
    .steps{display:flex; gap:8px; flex-wrap:wrap}
    .step{padding:6px 10px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid var(--bd); font-size:12px}
    .step.done{background:rgba(34,197,94,.18); border-color:rgba(34,197,94,.35)}
    .grid{display:grid; gap:12px}
    .grid-3{grid-template-columns:1fr 1fr 1fr}
    .preview img{width:100%; height:auto; display:block; border-radius:12px; background:#000; border:1px solid var(--bd)}
    .label{font-size:12px; color:var(--muted); margin:6px 0 4px}
    .spacer{height:2px; background:linear-gradient(90deg, #1f2937, transparent)}
  </style>

  <!-- MediaPipe UMD -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
</head>
<body>
  <div class="container">
    <div class="brand">
      <div class="logo"></div>
      <h1>KYC</h1>
    </div>

    <!-- Stage -->
    <div class="card">
      <div class="row" style="justify-content:space-between; margin-bottom:10px;">
        <div class="steps">
          <span id="stF" class="step">Trực diện</span>
          <span id="stL" class="step">Phải</span>
          <span id="stR" class="step">Trái</span>
        </div>
        <span id="hint" class="hint">Nhìn TRỰC DIỆN & lại gần đến khi viền xanh → hệ thống tự chụp</span>
      </div>

      <div class="stage">
        <video id="video" playsinline autoplay muted></video>
        <canvas id="overlay"></canvas>
      </div>
    </div>

    <!-- Controls -->
    <div class="card">
      <div class="row" style="justify-content:space-between;">
        <div class="row">
          <span id="status" class="chip warn">Đang khởi tạo…</span>
        </div>
        <div class="row">
          <select id="cameraSelect" class="btn" style="display:none"></select>
          <button id="btnSwitch" class="btn ghost" style="display:none">Đổi camera</button>
          <button id="btnRetry" class="btn ghost"></button>
        </div>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="row grow">
          <input id="consent" type="checkbox" />
          <span class="hint">Tôi đồng ý thu thập dữ liệu khuôn mặt để KYC</span>
        </label>
        <button id="btnReset" class="btn ghost" disabled>CHỤP LẠI</button>
        <button id="btnSend" class="btn primary" disabled>GỬI</button>
      </div>
    </div>

    <!-- Preview -->
    <div class="card">
      <div class="grid grid-3 preview">
        <div>
          <div class="label">Ảnh – Trực diện</div>
          <img id="pvFront" src="avatar.png" alt="front crop">
        </div>
        <div>
          <div class="label">Ảnh – Phải</div>
          <img id="pvLeft" src="avatar.png" alt="left crop">
        </div>
        <div>
          <div class="label">Ảnh – Trái</div>
          <img id="pvRight" src="avatar.png" alt="right crop">
        </div>
      </div>
    </div>
  </div>

<script>
/* ========= Aliases ========= */
const mpFaceMesh = window;
const drawingUtils = window;

/* ========= DOM ========= */
const video = document.getElementById('video');
const overlay = document.getElementById('overlay'); const ctx = overlay.getContext('2d');
const statusEl = document.getElementById('status');
const hintEl = document.getElementById('hint');
const btnRetry = document.getElementById('btnRetry'); const btnSend = document.getElementById('btnSend'); const btnReset = document.getElementById('btnReset'); const consentEl = document.getElementById('consent');
const stF = document.getElementById('stF'); const stL = document.getElementById('stL'); const stR = document.getElementById('stR');
const cameraSelect = document.getElementById('cameraSelect'); const btnSwitch = document.getElementById('btnSwitch');
const pvFront = document.getElementById('pvFront'); const pvLeft = document.getElementById('pvLeft'); const pvRight = document.getElementById('pvRight');

const setBadge = (m,cls='') => { statusEl.className = `chip ${cls}`; statusEl.textContent = m; };
const ok   = m => setBadge(m,'ok'), warn = m => setBadge(m,'warn'), err = m => setBadge(m,'err');
const mark = (el, done) => el.classList.toggle('done', !!done);

/* ========= Sizing (fix overflow) ========= */
function stageRect(){ return document.querySelector('.stage').getBoundingClientRect(); }
function resizeOverlay(){
  const rect = stageRect();
  const dpr = window.devicePixelRatio || 1;
  overlay.width  = Math.floor(rect.width  * dpr);
  overlay.height = Math.floor(rect.height * dpr);
}
window.addEventListener('resize', resizeOverlay);

/* ========= Camera ========= */
let stream = null, currentDeviceId = null;
async function listCameras(){
  try{
    const devs = await navigator.mediaDevices.enumerateDevices();
    const cams = devs.filter(d=>d.kind==='videoinput');
    cameraSelect.innerHTML = '';
    cams.forEach((d,i)=>{
      const opt = document.createElement('option'); opt.value = d.deviceId; opt.textContent = d.label || `Camera ${i+1}`;
      cameraSelect.appendChild(opt);
    });
    const multi = cams.length > 1;
    cameraSelect.style.display = multi ? '' : 'none';
    btnSwitch.style.display = multi ? '' : 'none';
    return cams;
  }catch{return [];}
}
async function startCamera(deviceId){
  if (!navigator.mediaDevices?.getUserMedia) throw new Error('Trình duyệt không hỗ trợ camera');
  if (!window.isSecureContext && location.hostname !== 'localhost') throw new Error('Cần HTTPS hoặc localhost');
  const base = { width:{ideal:720}, height:{ideal:960}, facingMode:'user' };
  const exact = deviceId ? { video:{ deviceId:{ exact:deviceId }, ...base }, audio:false }
                         : { video:{ facingMode:{ exact:'user' }, ...base }, audio:false };
  const ideal = deviceId ? { video:{ deviceId:{ exact:deviceId }, ...base }, audio:false }
                         : { video:{ facingMode:{ ideal:'user' }, ...base }, audio:false };
  if (stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  try{ stream = await navigator.mediaDevices.getUserMedia(exact); }
  catch{ try{ stream = await navigator.mediaDevices.getUserMedia(ideal); }
         catch{ stream = await navigator.mediaDevices.getUserMedia({video:true, audio:false}); } }
  video.srcObject = stream;
  try{
    const s = stream.getVideoTracks()[0]?.getSettings?.() || {};
    currentDeviceId = s.deviceId || deviceId || null;
    await listCameras(); const opt=[...cameraSelect.options].find(o=>o.value===currentDeviceId); if (opt) cameraSelect.value=currentDeviceId;
  }catch{}
  ok('Camera đã bật');
  setTimeout(resizeOverlay, 120);
}
async function autoStart(){
  if (!navigator.mediaDevices?.getUserMedia){ err('Thiết bị không hỗ trợ getUserMedia'); return; }
  try{ warn('Đang yêu cầu quyền camera…'); await startCamera(currentDeviceId); }
  catch(e){ err(`Không mở được camera: ${e.message}`); }
}
btnSwitch.onclick = async()=>{ try{ await startCamera(cameraSelect.value); }catch(e){ err(e.message); } };
btnRetry.onclick  = async()=>{ await autoStart(); };
window.addEventListener('beforeunload', ()=>{ try{ stream?.getTracks().forEach(t=>t.stop()); }catch{} });

/* ========= Helpers ========= */
const dist=(a,b)=>Math.hypot(a.x-b.x, a.y-b.y);
function simpleYaw(landmarks){
  const L=landmarks[33], R=landmarks[263], N=landmarks[1];
  const midX=(L.x+R.x)/2, eyeDist=Math.max(0.0001, Math.abs(R.x-L.x));
  return (N.x-midX)/eyeDist; // âm: trái | dương: phải
}

/* Full-face box (không cắt miệng): dùng các mốc 10(top), 152(bottom), 234(left), 454(right) + biên bất đối xứng */
function getFullFaceBox(landmarks, W, H){
  const li = i => landmarks[i] || null;
  const topP = li(10),  botP = li(152), leftP = li(234), rightP = li(454);
  // fallback nếu thiếu mốc
  let minX = Math.min(leftP?.x ?? 1, ...landmarks.map(p=>p.x));
  let maxX = Math.max(rightP?.x ?? 0, ...landmarks.map(p=>p.x));
  let minY = Math.min(topP?.y ?? 1, ...landmarks.map(p=>p.y));
  let maxY = Math.max(botP?.y ?? 0, ...landmarks.map(p=>p.y));

  let x=minX*W, y=minY*H, w=(maxX-minX)*W, h=(maxY-minY)*H;

  // Biên: ngang ~28%, trên ~30%, dưới ~42% (ưu tiên phần dưới để không cắt miệng/cằm)
  const mx = w*0.28, myTop = h*0.30, myBot = h*0.42;

  x = Math.max(0, x - mx);
  y = Math.max(0, y - myTop);
  w = Math.min(W - x, w + 2*mx);
  h = Math.min(H - y, h + myTop + myBot);

  // Clamp trong khung
  if (x + w > W) w = W - x;
  if (y + h > H) h = H - y;

  return { x:Math.round(x), y:Math.round(y), w:Math.round(w), h:Math.round(h) };
}

/* ========= Flow (front -> left -> right) ========= */
const FRONT_THR = 0.05;
const YAW_THR   = 0.12;
const HOLD_FR   = 6;

const PROX_FRONT = 0.24;
const FACE_FRONT = 0.18;
const PROX_SIDE  = 0.18;
const FACE_SIDE  = 0.14;
const QHOLD_FRONT= 6, QHOLD_SIDE=4;

let baselineEye=0, baselineFace=0, frontQualityLocked=false;
let qHold=0, frontHold=0, leftHold=0, rightHold=0;

let captured = { front:false, left:false, right:false };
let crops    = { front:"", left:"", right:"" };

function allCaptured(){ return captured.front && captured.left && captured.right; }
function syncButtons(){
  btnReset.disabled = !(captured.front || captured.left || captured.right);
  btnSend.disabled  = !(consentEl.checked && allCaptured());
}
consentEl.addEventListener('change', syncButtons);
btnReset.onclick = ()=>{
  captured={front:false,left:false,right:false};
  crops={front:"",left:"",right:""};
  pvFront.src = pvLeft.src = pvRight.src = "";
  qHold=frontHold=leftHold=rightHold=0; frontQualityLocked=false; baselineEye=baselineFace=0;
  mark(stF,false); mark(stL,false); mark(stR,false);
  hintEl.textContent='Nhìn TRỰC DIỆN & lại gần đến khi viền xanh → hệ thống tự chụp';
  syncButtons(); ok('Đã reset.');
};

/* Offscreen frame cho crop chuẩn */
const frameCanvas = document.createElement('canvas'); const fctx = frameCanvas.getContext('2d');
function cropFromFrame(box){
  const out = document.createElement('canvas'); out.width=box.w; out.height=box.h;
  out.getContext('2d').drawImage(frameCanvas, box.x, box.y, box.w, box.h, 0, 0, box.w, box.h);
  return out.toDataURL('image/jpeg', 0.95);
}
function snapshot(tag, box, eyeFrac, faceRatio){
  const data = cropFromFrame(box);
  crops[tag] = data; captured[tag]=true;

  if (tag==='front'){
    pvFront.src = data; mark(stF,true);
    if (!frontQualityLocked){ frontQualityLocked=true; baselineEye=eyeFrac; baselineFace=faceRatio; }
    hintEl.textContent='Tốt! QUAY PHẢI & giữ ổn định (viền xanh) để chụp…';
  } else if (tag==='left'){
    pvLeft.src = data; mark(stL,true);
    hintEl.textContent='Tốt! QUAY TRÁI & giữ ổn định (viền xanh) để chụp…';
  } else if (tag==='right'){
    pvRight.src = data; mark(stR,true);
    hintEl.textContent='Đủ 3 ảnh. Kiểm tra preview rồi nhấn GỬI.';
  }
  syncButtons();
}

/* ========= MediaPipe FaceMesh ========= */
let mesh, camera;
async function initFaceMesh(){
  mesh = new mpFaceMesh.FaceMesh({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
  });
  mesh.setOptions({ maxNumFaces:1, refineLandmarks:true, minDetectionConfidence:0.6, minTrackingConfidence:0.6 });
  mesh.onResults(onResults);

  try{
    camera = new Camera(video, {
      onFrame: async () => { await mesh.send({ image: video }); },
      width:  720, height: 960
    });
    await camera.start();
    warn('Camera đang chạy');
  }catch(e){ err('Không khởi động xử lý khuôn mặt: ' + e.message); }
}

function onResults(results){
  // Đồng bộ overlay & frameCanvas
  if (overlay.width === 0 || overlay.height === 0) resizeOverlay();
  if (frameCanvas.width !== overlay.width || frameCanvas.height !== overlay.height){
    frameCanvas.width = overlay.width; frameCanvas.height = overlay.height;
  }

  // Vẽ khung gốc (crop) & overlay (hướng dẫn)
  fctx.clearRect(0,0,frameCanvas.width,frameCanvas.height);
  fctx.drawImage(results.image, 0, 0, frameCanvas.width, frameCanvas.height);

  ctx.clearRect(0,0,overlay.width,overlay.height);
  ctx.drawImage(results.image, 0, 0, overlay.width, overlay.height);

  const landmarks = results.multiFaceLandmarks && results.multiFaceLandmarks[0];
  if (!landmarks){ warn('Không thấy khuôn mặt'); return; }

  // Vẽ oval nhẹ
  drawingUtils.drawConnectors(ctx, landmarks, mpFaceMesh.FACEMESH_FACE_OVAL, { lineWidth:1.0 });

  const box = getFullFaceBox(landmarks, overlay.width, overlay.height);
  const faceRatio = (box.w*box.h)/(overlay.width*overlay.height);
  const eyeFrac   = Math.abs(landmarks[263].x - landmarks[33].x); // normalized 0..1 theo input
  const yaw       = simpleYaw(landmarks);

  const stage = !captured.front ? 'front' : (!captured.left ? 'left' : (!captured.right ? 'right' : 'done'));

  // Quality theo stage + baseline (sau khi pass trực diện)
  let proxThr = (stage==='front') ? PROX_FRONT : PROX_SIDE;
  let faceThr = (stage==='front') ? FACE_FRONT : FACE_SIDE;
  if (frontQualityLocked && stage!=='front'){
    proxThr = Math.min(proxThr, baselineEye*0.70);
    faceThr = Math.min(faceThr, baselineFace*0.75);
  }

  const need = (stage==='front') ? QHOLD_FRONT : QHOLD_SIDE;
  const qNow = (eyeFrac >= proxThr) && (faceRatio >= faceThr);
  qHold = qNow ? (qHold+1) : 0;

  // Viền chỉ dẫn
  ctx.lineWidth = 2;
  ctx.strokeStyle = (qHold>=need) ? 'rgba(34,197,94,0.95)' : 'rgba(245,158,11,0.95)';
  ctx.strokeRect(box.x, box.y, box.w, box.h);

  // Dwell chụp theo tư thế (khi quality đạt)
  if (qHold>=need){
    if (stage==='front'){
      if (Math.abs(yaw) <= FRONT_THR) frontHold++; else frontHold=0;
      if (frontHold>=HOLD_FR){ snapshot('front', box, eyeFrac, faceRatio); }
      warn('Chất lượng OK – giữ TRỰC DIỆN để chụp…');
    } else if (stage==='left'){
      if (yaw <= -YAW_THR) leftHold++; else leftHold=0;
      if (leftHold>=HOLD_FR){ snapshot('left', box, eyeFrac, faceRatio); }
      warn('Chất lượng OK – giữ QUAY PHẢI để chụp…');
    } else if (stage==='right'){
      if (yaw >=  YAW_THR) rightHold++; else rightHold=0;
      if (rightHold>=HOLD_FR){ snapshot('right', box, eyeFrac, faceRatio); }
      warn('Chất lượng OK – giữ QUAY TRÁI để chụp…');
    } else {
      ok('ĐÃ CHỤP ĐỦ 3 ẢNH ✓');
    }
  } else {
    frontHold=leftHold=rightHold=0;
    warn('Vui lòng LẠI GẦN camera để ảnh rõ hơn');
    if (stage==='front') hintEl.textContent='Nhìn TRỰC DIỆN & lại gần đến khi viền xanh…';
    if (stage==='left')  hintEl.textContent='QUAY PHẢI & lại gần một chút đến khi viền xanh…';
    if (stage==='right') hintEl.textContent='QUAY TRÁI & lại gần một chút đến khi viền xanh…';
  }

  // Cập nhật bước
  mark(stF, captured.front); mark(stL, captured.left); mark(stR, captured.right);
}

/* ========= Upload (crop only) ========= */
btnSend.onclick = async ()=>{
  if (!consentEl.checked) return alert('Vui lòng tích đồng ý trước khi gửi.');
  if (!allCaptured()) return alert('Chưa đủ 3 ảnh (trực diện/trái/phải).');

  warn('Đang gửi…');
  const payload = { consent:true, crops: { front:crops.front, left:crops.left, right:crops.right } };

  const res = await fetch('/api/kyc/upload', {
    method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
  }).catch(e=>({ok:false}));

  if (res && res.ok) ok('Gửi thành công ✓'); else err('Gửi thất bại');
};

/* ========= Bootstrap ========= */
(async function(){
  if (!window.isSecureContext && location.hostname!=='localhost') warn('Hãy mở qua HTTPS hoặc localhost để dùng camera.');
  await autoStart();
  await initFaceMesh();
  await listCameras();
  syncButtons();
})();
</script>
</body>
</html>
