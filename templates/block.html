<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo chào mừng</title>
    <link rel="stylesheet" href="welcome-notification.css">
</head>
<body>
    <div class="welcome-container">
        <div class="welcome-card">
            <div class="avatar-container">
                <img src="professional-business-portrait-of-vietnamese-man-i.jpg" alt="Ông Nguyễn Văn A" class="avatar">
            </div>
            
            <h2 class="welcome-title">
                Chào mừng <span class="highlight">Ông Nguyễn Văn A</span>
            </h2>
            <p class="position">
                Giám đốc Kinh doanh - Công ty TNHH Thương mại Việt Nam
            </p>

            <!-- Removed all Tailwind classes that were overriding custom CSS -->
            <div class="success-message">
                <p class="message-text">
                    🎉 Chúng tôi rất vui mừng được chào đón ông tham gia hội nghị!
                </p>
                <p class="sub-message">
                    Hãy tận hưởng những phiên thảo luận bổ ích và cơ hội kết nối tuyệt vời.
                </p>
            </div>
        </div>
    </div>
</body>
</html>
