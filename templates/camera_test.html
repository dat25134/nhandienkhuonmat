<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Test - Khung xanh nhận diện</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/modern-ui.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👤</text></svg>">
</head>
<body>
    <div class="container">
        <div class="brand">
            <div class="logo"></div>
            <h1>📷 Camera Test - Khung xanh nhận diện khuôn mặt</h1>
        </div>
        <nav>
            <a href="/">Trang chủ</a>
            <a href="/welcome">Welcome</a>
            <a href="/training">Training</a>
            <a href="/manage">Quản lý</a>
            <a href="/checkins">Check-ins</a>
        </nav>
        
        <div class="card camera-section">
            <h2>Camera Test</h2>
            <div class="camera-controls">
                <select id="cameraSelect">
                    <option value="">Chọn camera...</option>
                </select>
                <button id="startBtn" class="btn btn-primary">Bật camera</button>
                <button id="stopBtn" class="btn btn-secondary" disabled>Tắt camera</button>
                <button id="testBtn" class="btn btn-info" disabled>Test overlay</button>
            </div>
            
            <div class="video-container">
                <video id="video" autoplay muted playsinline></video>
                <canvas id="overlay"></canvas>
            </div>
        </div>
        
        <div class="card">
            <div id="status" class="chip warn">Sẵn sàng bật camera</div>
        </div>
        
        <div class="card">
            <h3>Debug Info</h3>
            <div id="debug" style="background: rgba(0,0,0,.2); padding: 15px; border-radius: 8px; font-family: monospace; font-size: 12px; max-height: 200px; overflow-y: auto;">Debug info sẽ hiển thị ở đây...</div>
        </div>
    </div>

    <script>
        class CameraTest {
            constructor() {
                this.video = document.getElementById('video');
                this.overlay = document.getElementById('overlay');
                this.cameraSelect = document.getElementById('cameraSelect');
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.testBtn = document.getElementById('testBtn');
                this.status = document.getElementById('status');
                this.debug = document.getElementById('debug');
                this.stream = null;
                this.detecting = false;
                this.mediaPipeLoaded = false;
                this.mesh = null;
                this.camera = null;
                
                this.init();
            }
            
            async init() {
                await this.loadCameras();
                this.setupEvents();
            }
            
            async loadCameras() {
                try {
                    this.cameraSelect.innerHTML = '<option value="">Chọn camera...</option>';
                    
                    const devices = await navigator.mediaDevices.enumerateDevices();
                    const cameras = devices.filter(device => device.kind === 'videoinput');
                    
                    if (cameras.length > 0) {
                        cameras.forEach((camera, index) => {
                            const option = document.createElement('option');
                            option.value = index;
                            option.textContent = camera.label || `Camera ${index + 1}`;
                            this.cameraSelect.appendChild(option);
                        });
                    } else {
                        const option = document.createElement('option');
                        option.value = 'default';
                        option.textContent = 'Camera mặc định';
                        this.cameraSelect.appendChild(option);
                    }
                } catch (error) {
                    this.log('Lỗi tải camera: ' + error.message);
                }
            }
            
            setupEvents() {
                this.startBtn.addEventListener('click', () => this.startCamera());
                this.stopBtn.addEventListener('click', () => this.stopCamera());
                this.testBtn.addEventListener('click', () => this.testOverlay());
            }
            
            log(message) {
                console.log(message);
                const timestamp = new Date().toLocaleTimeString();
                this.debug.innerHTML += `[${timestamp}] ${message}<br>`;
                this.debug.scrollTop = this.debug.scrollHeight;
            }
            
            updateStatus(message, type = 'warn') {
                this.status.textContent = message;
                this.status.className = `chip ${type}`;
            }
            
            async startCamera() {
                const selectedIndex = this.cameraSelect.value;
                if (!selectedIndex) {
                    this.log('Vui lòng chọn camera');
                    return;
                }
                
                try {
                    this.log('Đang khởi động camera...');
                    this.updateStatus('Đang khởi động camera...', 'warn');
                    
                    // Load MediaPipe
                    if (!window.mpFaceMesh) {
                        await this.loadMediaPipe();
                    }
                    
                    // Start camera
                    let constraints;
                    if (selectedIndex === 'default') {
                        constraints = { video: true };
                    } else {
                        const devices = await navigator.mediaDevices.enumerateDevices();
                        const cameras = devices.filter(device => device.kind === 'videoinput');
                        constraints = {
                            video: {
                                deviceId: cameras[selectedIndex].deviceId ? { exact: cameras[selectedIndex].deviceId } : undefined
                            }
                        };
                    }
                    
                    this.stream = await navigator.mediaDevices.getUserMedia(constraints);
                    this.video.srcObject = this.stream;
                    
                    this.video.onloadedmetadata = () => {
                        this.log('Video loaded, setting up overlay...');
                        this.setupOverlay();
                        this.startFaceDetection();
                        this.updateStatus('Camera đã bật - đang phát hiện khuôn mặt...', 'ok');
                        this.startBtn.disabled = true;
                        this.stopBtn.disabled = false;
                        this.testBtn.disabled = false;
                    };
                    
                } catch (error) {
                    this.log('Lỗi camera: ' + error.message);
                    let errorMessage = 'Lỗi: ';
                    
                    if (error.message && error.message.includes('MediaPipe')) {
                        errorMessage += 'MediaPipe không thể tải. Vui lòng kiểm tra kết nối internet và thử lại.';
                    } else if (error.message && error.message.includes('HTTPS')) {
                        errorMessage += 'MediaPipe cần HTTPS hoặc localhost để hoạt động.';
                    } else {
                        errorMessage += error.message;
                    }
                    
                    this.updateStatus(errorMessage, 'err');
                }
            }
            
            async loadMediaPipe() {
                return new Promise((resolve, reject) => {
                    // Kiểm tra HTTPS requirement
                    if (!window.isSecureContext && location.hostname !== 'localhost') {
                        reject(new Error('MediaPipe cần HTTPS hoặc localhost để hoạt động'));
                        return;
                    }
                    
                    // Kiểm tra xem MediaPipe đã được load chưa
                    if (window.mpFaceMesh && window.drawingUtils && window.Camera) {
                        this.mediaPipeLoaded = true;
                        this.log('MediaPipe loaded successfully');
                        resolve();
                        return;
                    }
                    
                    let loadedCount = 0;
                    const totalScripts = 3;
                    
                    const checkComplete = () => {
                        loadedCount++;
                        if (loadedCount === totalScripts) {
                            this.mediaPipeLoaded = true;
                            this.log('MediaPipe loaded successfully');
                            resolve();
                        }
                    };
                    
                    // Load face_mesh.js
                    if (!window.mpFaceMesh) {
                        const script1 = document.createElement('script');
                        script1.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js';
                        script1.onload = checkComplete;
                        script1.onerror = reject;
                        document.head.appendChild(script1);
                    } else {
                        checkComplete();
                    }
                    
                    // Load camera_utils.js
                    if (!window.Camera) {
                        const script2 = document.createElement('script');
                        script2.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js';
                        script2.onload = checkComplete;
                        script2.onerror = reject;
                        document.head.appendChild(script2);
                    } else {
                        checkComplete();
                    }
                    
                    // Load drawing_utils.js
                    if (!window.drawingUtils) {
                        const script3 = document.createElement('script');
                        script3.src = 'https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js';
                        script3.onload = checkComplete;
                        script3.onerror = reject;
                        document.head.appendChild(script3);
                    } else {
                        checkComplete();
                    }
                });
            }
            
            setupOverlay() {
                const rect = this.video.getBoundingClientRect();
                this.overlay.width = rect.width;
                this.overlay.height = rect.height;
                this.overlay.style.width = rect.width + 'px';
                this.overlay.style.height = rect.height + 'px';
                
                this.log(`Overlay setup: ${rect.width}x${rect.height}`);
            }
            
            async startFaceDetection() {
                if (!this.mediaPipeLoaded) {
                    this.log('MediaPipe chưa load');
                    return;
                }
                
                this.detecting = true;
                this.log('Bắt đầu phát hiện khuôn mặt với MediaPipe...');
                
                try {
                    // Set up MediaPipe aliases
                    const mpFaceMesh = window.mpFaceMesh || window;
                    const drawingUtils = window.drawingUtils || window;
                    
                    // Khởi tạo FaceMesh
                    this.mesh = new mpFaceMesh.FaceMesh({
                        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
                    });
                    
                    this.mesh.setOptions({ 
                        maxNumFaces: 1, 
                        refineLandmarks: true, 
                        minDetectionConfidence: 0.6, 
                        minTrackingConfidence: 0.6 
                    });
                    
                    this.mesh.onResults((results) => this.onResults(results));
                    
                    // Khởi tạo Camera
                    this.camera = new Camera(this.video, {
                        onFrame: async () => { 
                            await this.mesh.send({ image: this.video }); 
                        },
                        width: 720, 
                        height: 960
                    });
                    
                    await this.camera.start();
                    this.log('MediaPipe camera started');
                    
                } catch (error) {
                    this.log('Lỗi khởi tạo MediaPipe: ' + error.message);
                    this.status.textContent = 'Lỗi MediaPipe: ' + error.message;
                }
            }
            
            onResults(results) {
                const ctx = this.overlay.getContext('2d');
                ctx.clearRect(0, 0, this.overlay.width, this.overlay.height);
                
                // KHÔNG vẽ lại ảnh từ MediaPipe - chỉ vẽ overlay landmarks
                // Để giữ nguyên ảnh gốc từ video cho việc capture
                
                const landmarks = results.multiFaceLandmarks && results.multiFaceLandmarks[0];
                if (!landmarks) {
                    this.updateStatus('Không phát hiện khuôn mặt', 'warn');
                    return;
                }
                
                // Vẽ oval nhẹ trên overlay (không ảnh hưởng đến ảnh gốc)
                const mpFaceMesh = window.mpFaceMesh || window;
                const drawingUtils = window.drawingUtils || window;
                
                drawingUtils.drawConnectors(ctx, landmarks, mpFaceMesh.FACEMESH_FACE_OVAL, { 
                    lineWidth: 2.0,
                    color: 'rgba(0, 255, 0, 0.8)'
                });
                
                // Vẽ khung khuôn mặt trên overlay
                const faceBox = this.getFaceBox(landmarks);
                if (faceBox) {
                    ctx.strokeStyle = '#00ff00';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(faceBox.x, faceBox.y, faceBox.width, faceBox.height);
                    
                    ctx.fillStyle = 'rgba(0, 255, 0, 0.2)';
                    ctx.fillRect(faceBox.x, faceBox.y, faceBox.width, faceBox.height);
                    
                    ctx.fillStyle = '#00ff00';
                    ctx.font = '16px Arial';
                    ctx.fillText('Face Detected', faceBox.x, faceBox.y - 5);
                }
                
                this.updateStatus('Phát hiện 1 khuôn mặt', 'ok');
            }
            
            getFaceBox(landmarks) {
                if (!landmarks || landmarks.length < 468) return null;
                
                try {
                    let minX = 1, maxX = 0, minY = 1, maxY = 0;
                    
                    // Sử dụng các điểm quan trọng của khuôn mặt
                    const importantPoints = [
                        10, 152, 234, 454, // Các điểm góc
                        33, 263, // Mắt
                        1, 2, 3, 4, 5, // Mũi
                        61, 84, 17, 18, 19, 20, 21, // Miệng
                        172, 136, 150, 149, 176, 148, 152, 377, 400, 378, 379, 365, 397, 288, 361, 323 // Jawline
                    ];
                    
                    importantPoints.forEach(index => {
                        if (landmarks[index]) {
                            minX = Math.min(minX, landmarks[index].x);
                            maxX = Math.max(maxX, landmarks[index].x);
                            minY = Math.min(minY, landmarks[index].y);
                            maxY = Math.max(maxY, landmarks[index].y);
                        }
                    });
                    
                    const width = (maxX - minX) * this.overlay.width;
                    const height = (maxY - minY) * this.overlay.height;
                    const x = minX * this.overlay.width;
                    const y = minY * this.overlay.height;
                    
                    return { x, y, width, height };
                } catch (error) {
                    console.warn('Lỗi tính toán face box:', error);
                    return null;
                }
            }
            
            
            testOverlay() {
                this.log('Testing overlay...');
                
                const ctx = this.overlay.getContext('2d');
                if (!ctx) {
                    this.log('ERROR: No canvas context!');
                    return;
                }
                
                // Clear and draw test rectangle
                ctx.clearRect(0, 0, this.overlay.width, this.overlay.height);
                
                ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
                ctx.fillRect(50, 50, 200, 150);
                
                ctx.strokeStyle = 'red';
                ctx.lineWidth = 5;
                ctx.strokeRect(50, 50, 200, 150);
                
                ctx.fillStyle = 'red';
                ctx.font = '20px Arial';
                ctx.fillText('TEST OVERLAY', 60, 100);
                
                this.log('Overlay test completed - should see red rectangle');
                this.updateStatus('Test overlay - kiểm tra khung đỏ', 'warn');
            }
            
            stopCamera() {
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                    this.stream = null;
                }
                
                if (this.camera) {
                    this.camera.stop();
                    this.camera = null;
                }
                
                if (this.mesh) {
                    this.mesh.close();
                    this.mesh = null;
                }
                
                this.video.srcObject = null;
                this.detecting = false;
                this.startBtn.disabled = false;
                this.stopBtn.disabled = true;
                this.testBtn.disabled = true;
                this.updateStatus('Camera đã tắt', 'warn');
                this.log('Camera stopped');
            }
        }
        
        // Start when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new CameraTest();
        });
    </script>
</body>
</html>
